<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=5.0, user-scalable=yes">
    <title>차량 정비 대장</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; background-color: #f4f6f9; color: #333; letter-spacing: -0.3px; padding-bottom: 40px; }
        .container { max-width: 1500px; margin: 15px auto; padding: 0 15px; display: flex; flex-direction: column; gap: 16px; }
        .card { background: #fff; padding: 18px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .top-bar { max-width: 1500px; margin: 12px auto 0; padding: 6px 15px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
        .top-title { display: flex; align-items: center; gap: 8px; font-size: 1.2rem; font-weight: 900; color: #155724; }
        .top-user { font-size: 0.85rem; font-weight: 700; color: #555; background: #e8f5e9; padding: 4px 10px; border-radius: 20px; }
        #global-alert-banner { display: none; background: #fff5f5; border: 2px solid #f5c6cb; border-radius: 10px; padding: 14px 16px; box-shadow: 0 2px 6px rgba(220,53,69,0.08); }
        .alert-banner-title { font-size: 0.95rem; font-weight: 900; color: #dc3545; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .alert-banner-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
        .alert-banner-item { background: #fff; border: 1px solid #f1b0b7; border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
        .month-title-box { display: flex; align-items: center; gap: 8px; }
        #current-month-display { font-size: 1.3rem; font-weight: 800; color: #155724; cursor: pointer; }
        .btn-today-mini { background: #e8f5e9; color: #155724; border: 1px solid #c3e6cb; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; cursor: pointer; }
        .header-action-group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
        .btn-nav-arrow { padding: 4px 10px; font-size: 1rem; font-weight: bold; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 6px; font-family: inherit; }
        .btn-nav-arrow:hover { background: #f1f3f5; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(150px, 1fr)); gap: 4px; overflow-x: auto; padding-bottom: 6px; }
        .calendar-day-header { font-weight: 800; text-align: center; padding: 8px; background: #eef2f7; border-radius: 4px; font-size: 0.9rem; }
        .calendar-day-header.sun { color: #d9534f; }
        .calendar-day-header.sat { color: #0275d8; }
        .calendar-cell { min-width: 0; min-height: 155px; background: #fff; border: 1px solid #e1e4e8; border-radius: 6px; padding: 4px; font-size: 1.05rem; cursor: pointer; display: flex; flex-direction: column; transition: 0.15s; position: relative; }
        .calendar-cell:hover { background: #f8fdf9; border-color: #28a745; }
        .calendar-cell.selected { border: 2px solid #28a745; background: #f0fdf4; }
        .calendar-cell.sun .date-num { color: #d9534f; font-weight: 800; }
        .calendar-cell.sat .date-num { color: #0275d8; font-weight: 800; }
        .calendar-cell.holiday .date-num { color: #d9534f !important; font-weight: 800; }
        .holiday-name { font-size: 0.75rem; color: #d9534f; font-weight: 700; letter-spacing: -0.5px; text-align: right; word-break: keep-all; margin-left: 4px; }
        .tag-container { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; flex: 1; width: 100%; }
        .event-box { display: flex; align-items: center; gap: 4px; padding: 3px 5px; border-radius: 4px; font-size: 0.76rem; letter-spacing: -0.6px; font-weight: 700; line-height: 1.25; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .event-box.routine { background-color: #fff8e1; border: 1px solid #ffecb3; color: #333; }
        .event-box.breakdown { background-color: #fce4ec; border: 1px solid #f8bbd0; color: #b71c1c; }
        .event-box.preventive { background-color: #e8f0fe; border: 1px solid #c6dafc; color: #0d47a1; }
        .event-box.issue { background-color: #f3e5f5; border: 1px solid #e1bee7; color: #4a148c; }
        .event-box.inspection { background-color: #e6fcf5; border: 1px solid #96f2d7; color: #087f5b; }
        .mini-badge { padding: 1px 4px; border-radius: 3px; font-size: 0.62rem; font-weight: 800; color: #fff; flex-shrink: 0; }
        .mini-badge.routine { background: #fd7e14; }
        .mini-badge.breakdown { background: #dc3545; }
        .mini-badge.preventive { background: #007bff; }
        .mini-badge.issue { background: #8e44ad; }
        .mini-badge.inspection { background: #20c997; }
        .detail-header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #28a745; padding-bottom: 10px; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .result-list { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
        .result-list li { background: #f8f9fa; border: 1px solid #dee2e6; padding: 14px; border-radius: 8px; font-size: 0.92rem; line-height: 1.55; display: flex; flex-direction: column; justify-content: space-between; }
        #modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.55); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 12px; }
        .modal-content { background: #fff; width: 100%; max-width: 500px; padding: 22px; border-radius: 14px; box-shadow: 0 12px 30px rgba(0,0,0,0.22); max-height: 92vh; overflow-y: auto; }
        .modal-title { font-size: 1.15rem; font-weight: 900; margin-bottom: 14px; color: #155724; border-bottom: 2px solid #e9ecef; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .veh-chip-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
        .veh-chip { padding: 8px 4px; border: 1px solid #ced4da; background: #f8f9fa; border-radius: 6px; font-size: 0.82rem; font-weight: 800; color: #495057; cursor: pointer; text-align: center; transition: 0.15s; }
        .veh-chip:hover { background: #e9ecef; }
        .veh-chip.active { background: #155724; color: #fff; border-color: #155724; box-shadow: 0 2px 5px rgba(21,87,36,0.25); }
        #recent-record-hint { background: #e8f5e9; border: 1px solid #c3e6cb; color: #155724; padding: 8px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
        .btn-fill-last { background: #28a745; color: #fff; border: none; padding: 3px 8px; border-radius: 4px; font-size: 0.72rem; font-weight: 800; cursor: pointer; white-space: nowrap; }
        .type-toggle-container { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; background: #f1f3f5; padding: 6px; border-radius: 10px; }
        .type-toggle-row { display: flex; gap: 5px; }
        .type-toggle-row input[type="radio"] { display: none; }
        .type-toggle-row label { flex: 1; text-align: center; padding: 9px 4px; background: #fff; border: 1px solid #dee2e6; border-radius: 7px; cursor: pointer; font-weight: 800; color: #555; font-size: 0.84rem; letter-spacing: -0.5px; transition: 0.15s; }
        .type-toggle-row input[type="radio"]:checked + label.routine { background: #fd7e14; color: #fff; border-color: #fd7e14; box-shadow: 0 2px 6px rgba(253,126,20,0.3); }
        .type-toggle-row input[type="radio"]:checked + label.breakdown { background: #dc3545; color: #fff; border-color: #dc3545; box-shadow: 0 2px 6px rgba(220,53,69,0.3); }
        .type-toggle-row input[type="radio"]:checked + label.preventive { background: #007bff; color: #fff; border-color: #007bff; box-shadow: 0 2px 6px rgba(0,123,255,0.3); }
        .type-toggle-row input[type="radio"]:checked + label.inspection { background: #20c997; color: #fff; border-color: #20c997; box-shadow: 0 2px 6px rgba(32,201,151,0.3); }
        .type-toggle-row input[type="radio"]:checked + label.issue { background: #8e44ad; color: #fff; border-color: #8e44ad; box-shadow: 0 2px 6px rgba(142,68,173,0.3); }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 5px; font-size: 0.85rem; color: #444; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #ced4da; border-radius: 7px; font-size: 0.95rem; font-family: inherit; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #28a745; box-shadow: 0 0 0 2px rgba(40,167,69,0.15); }
        .input-unit-wrap { position: relative; display: flex; align-items: center; }
        .input-unit-wrap input { padding-right: 38px; font-weight: 700; }
        .input-unit-wrap .unit-txt { position: absolute; right: 12px; font-size: 0.82rem; font-weight: 800; color: #888; pointer-events: none; }
        .issue-warning-box { background: #fff3cd; border: 1px solid #ffeeba; color: #856404; padding: 12px; border-radius: 8px; margin-bottom: 14px; font-size: 0.85rem; display: none; flex-direction: column; gap: 8px; }
        .issue-item { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 8px 10px; border-radius: 6px; border: 1px solid #f5c6cb; gap: 8px; }
        .checklist-group { background: #f8f9fa; padding: 12px; border-radius: 8px; border: 1px solid #e1e4e8; margin-top: 8px; }
        .cl-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #ccc; padding-bottom: 8px; margin-bottom: 10px; }
        .cl-title { color: #0056b3; font-weight: 800; font-size: 0.88rem; }
        .btn-check-all { background: #fd7e14; color: #fff; border: none; padding: 4px 10px; border-radius: 6px; font-size: 0.78rem; font-weight: 800; cursor: pointer; }
        .checklist-grid { display: grid; grid-template-columns: 1fr; gap: 6px; }
        .checklist-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: #fff; border: 1px solid #e9ecef; border-radius: 6px; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: 0.1s; }
        .checklist-item:hover { border-color: #fd7e14; }
        .checklist-item input { width: 18px; height: 18px; cursor: pointer; accent-color: #fd7e14; flex-shrink: 0; }
        .modal-btns { display: flex; gap: 10px; margin-top: 18px; }
        .btn-save { flex: 1.3; padding: 12px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: 800; font-size: 1rem; cursor: pointer; }
        .btn-cancel { flex: 0.7; padding: 12px; background: #6c757d; color: white; border: none; border-radius: 8px; font-weight: 800; font-size: 1rem; cursor: pointer; }
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 1.15rem; font-weight: 800; color: #28a745; transition: opacity 0.3s; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #28a745; border-radius: 50%; width: 38px; height: 38px; animation: spin 1s linear infinite; margin-bottom: 12px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (max-width: 768px) {
            .container { padding: 0 10px; margin: 10px auto; }
            .card { padding: 14px; }
            .veh-chip-grid { grid-template-columns: repeat(3, 1fr); }
            .result-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <span id="loading-text">차량 정비 데이터 불러오는 중...</span>
    </div>

    <div class="top-bar">
        <div class="top-title">
            <span>🔧 차량 정비 및 일일점검 대장</span>
        </div>
        <span class="top-user" id="user-badge">작성자 확인 중</span>
    </div>

    <div class="container">
        <div id="global-alert-banner">
            <div class="alert-banner-title">🚨 현재 미해결 차량 경고 (정비 및 재검 요망)</div>
            <div class="alert-banner-grid" id="global-alert-list"></div>
        </div>

        <div class="card">
            <div class="calendar-header">
                <div class="month-title-box">
                    <span id="current-month-display" onclick="goToToday()" title="클릭하면 오늘 날짜로 이동합니다">26년 10월</span>
                    <button class="btn-today-mini" onclick="goToToday()">오늘</button>
                </div>

                <div class="header-action-group">
                    <button onclick="openModalForSelectedDate()" style="background: #ffc107; color: #000; border: none; padding: 4px 10px; border-radius: 6px; font-weight: 900; font-size: 0.8rem; cursor: pointer;">+ 기록추가</button>
                    <button id="btn-toggle-view" onclick="toggleViewMode()" style="background: #17a2b8; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; cursor: pointer;">PC버전</button>
                    <button onclick="location.href='stats.html'" style="background: #6f42c1; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; cursor: pointer;">집계</button>
                    <button onclick="location.href='index.html'" style="background: #007bff; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; cursor: pointer;">배차판</button>
                    <button class="btn-nav-arrow" onclick="changeMonth(-1)">＜</button>
                    <button class="btn-nav-arrow" onclick="changeMonth(1)">＞</button>
                </div>
            </div>

            <div class="calendar-grid" id="calendar-grid"></div>
        </div>

        <div class="card">
            <div class="detail-header-bar">
                <h3 id="detail-title" style="margin:0; font-size: 1.1rem; color: #155724;">기록 상세</h3>
                <button onclick="openModalForSelectedDate()" style="background: #28a745; color: #fff; border: none; padding: 5px 12px; border-radius: 6px; font-weight: 800; font-size: 0.8rem; cursor: pointer;">+ 이 날짜에 기록 추가</button>
            </div>
            <ul id="detail-content" class="result-list">
                <li style="color:#666; text-align:center; padding: 20px;">달력 날짜를 클릭하시면 상세 내역이 표시됩니다.</li>
            </ul>
        </div>
    </div>

    <div id="modal-overlay" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-title">
                <span id="modal-date-title">기록 추가</span>
                <span style="font-size:0.8rem; color:#666; font-weight:600;" id="modal-writer-label"></span>
            </div>
            <input type="hidden" id="m-date">
            <input type="hidden" id="m-doc-id">

            <div class="form-group" style="margin-bottom:8px;">
                <label>차량 선택 (터치)</label>
                <div class="veh-chip-grid" id="veh-chip-container"></div>
                <select id="m-vehicle" onchange="onVehicleSelectChange(this.value)" style="display:none;">
                    <option value="1호차">1호차</option><option value="2호차">2호차</option><option value="3호차">3호차</option>
                    <option value="예비버스">예비버스</option><option value="11호차">11호차</option><option value="12호차">12호차</option>
                    <option value="13호차">13호차</option><option value="14호차">14호차</option><option value="3818">3818</option>
                </select>
            </div>

            <div id="recent-record-hint">
                <span id="recent-record-text">💡 최근 기록 확인 중...</span>
                <button type="button" class="btn-fill-last" id="btn-copy-last-km" onclick="copyLastKmToInput()" style="display:none;">최근 KM 입력</button>
            </div>

            <div class="type-toggle-container">
                <div class="type-toggle-row">
                    <input type="radio" id="type-routine" name="m-type" value="일정비" onchange="toggleFormType()" checked>
                    <label for="type-routine" class="routine">📝 일지(일정비)</label>

                    <input type="radio" id="type-issue" name="m-type" value="특이사항" onchange="toggleFormType()">
                    <label for="type-issue" class="issue">🚨 특이사항</label>
                </div>
                <div class="type-toggle-row">
                    <input type="radio" id="type-breakdown" name="m-type" value="고장수리" onchange="toggleFormType()">
                    <label for="type-breakdown" class="breakdown">🔧 고장수리</label>
                    
                    <input type="radio" id="type-preventive" name="m-type" value="예방정비" onchange="toggleFormType()">
                    <label for="type-preventive" class="preventive">🛡️ 예방정비</label>

                    <input type="radio" id="type-inspection" name="m-type" value="정기검사" onchange="toggleFormType()">
                    <label for="type-inspection" class="inspection">📋 정기검사</label>
                </div>
            </div>

            <div id="form-breakdown" style="display: none;">
                <div class="form-group"><label>고장 원인</label><input type="text" id="bd-cause" placeholder="예: 브레이크 밀림, 에어컨 불량"></div>
                <div class="form-group"><label>수리 부품</label><input type="text" id="bd-part" placeholder="예: 앞바퀴 라이닝, 콤프레샤"></div>
                <div class="form-group">
                    <label>누적 KM (수리 시점)</label>
                    <div class="input-unit-wrap">
                        <input type="text" inputmode="numeric" id="bd-total" oninput="formatNumberInput(this)" placeholder="예: 123,456">
                        <span class="unit-txt">km</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>정비 업체</label>
                    <select id="bd-shop" onchange="toggleCustomShop('bd')">
                        <option value="">업체 선택 안함</option>
                        <option value="용현점">용현점</option>
                        <option value="영남공업사">영남공업사</option>
                        <option value="파주공업사">파주공업사</option>
                        <option value="롯데칠성신협양평분점">롯데칠성신협양평분점</option>
                        <option value="노원자동차검사소">노원자동차검사소</option>
                        <option value="__custom__">기타 (직접 입력)</option>
                    </select>
                    <input type="text" id="bd-shop-custom" placeholder="정비 업체명 직접 입력" style="display:none; margin-top:6px;">
                </div>
                <div class="form-group">
                    <label>수리 내용 (조치 사항)</label>
                    <select id="bd-action">
                        <option value="교체">부품 교체</option><option value="수리">부품 수리</option>
                        <option value="보충">오일/가스 보충</option><option value="이슈처리">이슈 처리(단순 조치)</option>
                    </select>
                </div>
            </div>

            <div id="form-preventive" style="display: none;">
                <div class="form-group"><label>점검 / 정비 항목</label><input type="text" id="pv-item" placeholder="예: 엔진오일, 타이어, 분기세차"></div>
                <div class="form-group">
                    <label>누적 KM (정비 시점)</label>
                    <div class="input-unit-wrap">
                        <input type="text" inputmode="numeric" id="pv-total" oninput="formatNumberInput(this)" placeholder="예: 123,456">
                        <span class="unit-txt">km</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>정비 업체</label>
                    <select id="pv-shop" onchange="toggleCustomShop('pv')">
                        <option value="">업체 선택 안함</option>
                        <option value="용현점">용현점</option>
                        <option value="영남공업사">영남공업사</option>
                        <option value="파주공업사">파주공업사</option>
                        <option value="롯데칠성신협양평분점">롯데칠성신협양평분점</option>
                        <option value="노원자동차검사소">노원자동차검사소</option>
                        <option value="__custom__">기타 (직접 입력)</option>
                    </select>
                    <input type="text" id="pv-shop-custom" placeholder="정비 업체명 직접 입력" style="display:none; margin-top:6px;">
                </div>
                <div class="form-group">
                    <label>조치 내용</label>
                    <select id="pv-action">

                        <option value="영남공업사">영남공업사</option>

            <div id="form-issue" style="display: none;">

                <div class="form-group"><label>상세 내용 및 다음 운전자 주의사항</label><input type="text" id="is-detail" placeholder="예: 80km 이상 주행 시 진동 발생, 점검 요망"></div>
            </div>

            <div id="form-routine">
                <div id="issue-warning-container" class="issue-warning-box"></div>

                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>주행가능 거리</label>
                        <div class="input-unit-wrap">
                            <input type="text" inputmode="numeric" id="rt-range" oninput="formatNumberInput(this)" placeholder="숫자">
                            <span class="unit-txt">km</span>
                        </div>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>누적 주행거리 (필수)</label>
                        <div class="input-unit-wrap">
                            <input type="text" inputmode="numeric" id="rt-total" oninput="formatNumberInput(this)" placeholder="숫자">
                            <span class="unit-txt">km</span>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>요소수 잔량</label>
                    <div class="input-unit-wrap">
                        <input type="text" inputmode="numeric" id="rt-def" oninput="this.value = this.value.replace(/[^0-9]/g, '');" placeholder="예: 80, 100">
                        <span class="unit-txt">%</span>
                    </div>
                </div>
                
                <div class="checklist-group">
                    <div class="cl-header">
                        <span class="cl-title">✅ 출발 전 일일 점검 (6개 항목)</span>
                        <button type="button" class="btn-check-all" onclick="toggleAllCheckboxes()">전체 양호 체크</button>
                    </div>
                    <div class="checklist-grid">
                        <label class="checklist-item"><input type="checkbox" class="rt-chk" value="엔진오일"> 1. 엔진오일 량 확인</label>
                        <label class="checklist-item"><input type="checkbox" class="rt-chk" value="오일류/냉각수"> 2. 부동액, 브레이크액, 파워오일 확인</label>
                        <label class="checklist-item"><input type="checkbox" class="rt-chk" value="타이어"> 3. 타이어 공기압 / 마모 상태</label>
                        <label class="checklist-item"><input type="checkbox" class="rt-chk" value="제동장치"> 4. 제동장치 작동 확인</label>
                        <label class="checklist-item"><input type="checkbox" class="rt-chk" value="등화장치"> 5. 각종 등화장치 확인</label>
                        <label class="checklist-item"><input type="checkbox" class="rt-chk" value="리프트확인"> 6. 휠체어 리프트 작동 확인</label>
                    </div>
                </div>
            </div>

            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal()">취소</button>
                <button class="btn-save" id="btn-save-submit" onclick="saveMaintenance()">💾 저장하기</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCipeqfmU03bZQozFt8MdToxxuDyFIUd-g",
            authDomain: "park-fc66f.firebaseapp.com",
            projectId: "park-fc66f",
            storageBucket: "park-fc66f.firebasestorage.app",
            messagingSenderId: "93011031366",
            appId: "1:93011031366:web:72438cb8d71dd5a7902147"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        db.enablePersistence({ synchronizeTabs: true }).catch(function(err) {
            console.log("캐시 활성화 실패:", err);
        });

        const vehicleList = ['1호차', '2호차', '3호차', '예비버스', '11호차', '12호차', '13호차', '14호차', '3818'];
        const presetShops = ['용현점', '영남공업사', '파주공업사', '롯데칠성신협양평분점', '노원자동차검사소'];

        let currentDate = new Date();
        let selectedDateStr = "";
        let isMobileView = true;
        
        let allRecords = []; 
        let dailyDriverStatus = {};
        let currentUser = localStorage.getItem('loggedInUser') || '관리자';
        let isFirstLoad = true; 
        let lastKnownKm = '';

        function formatNumberInput(el) {
            el.value = el.value.replace(/[^0-9]/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        function initVehicleChips() {
            const container = document.getElementById('veh-chip-container');
            if (!container) return;
            container.innerHTML = vehicleList.map(v => `
                <button type="button" class="veh-chip" id="chip_${v}" onclick="selectVehicleChip('${v}')">${v}</button>
            `).join('');
        }

        function selectVehicleChip(v) {
            const selectEl = document.getElementById('m-vehicle');
            if (selectEl) selectEl.value = v;
            document.querySelectorAll('.veh-chip').forEach(btn => {
                btn.classList.toggle('active', btn.id === `chip_${v}`);
            });
            checkUnresolvedIssues();
            updateRecentVehicleHint(v);
        }

        function onVehicleSelectChange(v) {
            selectVehicleChip(v);
        }

        function updateRecentVehicleHint(vehicle) {
            const hintText = document.getElementById('recent-record-text');
            const copyBtn = document.getElementById('btn-copy-last-km');
            if (!hintText) return;

            const vehRecords = allRecords
                .filter(r => r.vehicle === vehicle && (r.total || r.def))
                .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

            if (vehRecords.length > 0) {
                const latest = vehRecords[0];
                const kmStr = latest.total ? `${latest.total.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',')}km` : '미입력';
                const defStr = latest.def ? ` · 요소수 ${latest.def}%` : '';
                hintText.innerText = `💡 [${vehicle}] 최근 기록 (${latest.date}): 누적 ${kmStr}${defStr}`;
                lastKnownKm = latest.total ? latest.total.toString().replace(/[^0-9]/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, ',') : '';
                if (copyBtn) copyBtn.style.display = lastKnownKm ? 'inline-block' : 'none';
            } else {
                hintText.innerText = `💡 [${vehicle}] 이번 달 등록된 누적 거리 기록이 없습니다.`;
                lastKnownKm = '';
                if (copyBtn) copyBtn.style.display = 'none';
            }
        }

        function copyLastKmToInput() {
            if (!lastKnownKm) return;
            if (document.getElementById('type-routine').checked) document.getElementById('rt-total').value = lastKnownKm;
            else if (document.getElementById('type-breakdown').checked) document.getElementById('bd-total').value = lastKnownKm;
            else if (document.getElementById('type-preventive').checked) document.getElementById('pv-total').value = lastKnownKm;
            else if (document.getElementById('type-inspection').checked) document.getElementById('ip-total').value = lastKnownKm;
        }

        function toggleAllCheckboxes() {
            const chks = Array.from(document.querySelectorAll('.rt-chk'));
            const allChecked = chks.every(c => c.checked);
            chks.forEach(c => c.checked = !allChecked);
        }

        function toggleCustomShop(prefix) {
            const sel = document.getElementById(`${prefix}-shop`);
            const inp = document.getElementById(`${prefix}-shop-custom`);
            if (!sel || !inp) return;
            if (sel.value === '__custom__') {
                inp.style.display = 'block';
                inp.focus();
            } else {
                inp.style.display = 'none';
                inp.value = '';
            }
        }

        function setShopFieldValue(prefix, shopVal) {
            const sel = document.getElementById(`${prefix}-shop`);
            const inp = document.getElementById(`${prefix}-shop-custom`);
            if (!sel || !inp) return;
            if (!shopVal) {
                sel.value = '';
                inp.style.display = 'none';
                inp.value = '';
            } else if (presetShops.includes(shopVal)) {
                sel.value = shopVal;
                inp.style.display = 'none';
                inp.value = '';
            } else {
                sel.value = '__custom__';
                inp.style.display = 'block';
                inp.value = shopVal;
            }
        }

        function getShopFieldValue(prefix) {
            const sel = document.getElementById(`${prefix}-shop`);
            const inp = document.getElementById(`${prefix}-shop-custom`);
            if (!sel) return '';
            if (sel.value === '__custom__') return (inp ? inp.value.trim() : '');
            return sel.value;
        }

        function toggleViewMode() {
            const viewport = document.querySelector('meta[name="viewport"]');
            const btn = document.getElementById('btn-toggle-view');
            if (isMobileView) {
                viewport.setAttribute('content', 'width=1050, user-scalable=yes');
                btn.innerText = '📱폰화면'; btn.style.background = '#ffc107'; btn.style.color = '#000'; isMobileView = false;
            } else {
                viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=5.0, user-scalable=yes');
                btn.innerText = 'PC버전'; btn.style.background = '#17a2b8'; btn.style.color = '#fff'; isMobileView = true;
            }
        }

        const koreaHolidays = {
            "01-01": "신정", "03-01": "삼일절", "05-05": "어린이날", "06-06": "현충일", 
            "08-15": "광복절", "10-03": "개천절", "10-09": "한글날", "12-25": "기독탄신일",
            "2026-02-16": "설날연휴", "2026-02-17": "설날", "2026-02-18": "설날연휴",
            "2026-03-02": "대체공휴일", "2026-05-24": "부처님오신날", "2026-05-25": "대체공휴일",
            "2026-06-03": "지방선거", "2026-08-17": "대체공휴일", "2026-09-24": "추석연휴", 
            "2026-09-25": "추석", "2026-09-26": "추석연휴", "2026-10-05": "대체공휴일",
            "2027-02-06": "설날연휴", "2027-02-07": "설날", "2027-02-08": "설날연휴", "2027-02-09": "대체공휴일",
            "2027-05-01": "노동절", "2027-05-03": "대체공휴일", "2027-05-13": "부처님오신날",
            "2027-07-17": "제헌절", "2027-07-19": "대체공휴일", "2027-08-15": "광복절",
            "2027-08-16": "대체공휴일", "2027-09-14": "추석연휴", "2027-09-15": "추석", "2027-09-16": "추석연휴",
            "2027-10-04": "대체공휴일", "2027-10-11": "대체공휴일", "2027-12-27": "대체공휴일"
        };

        function getHolidayName(year, month, day) {
            const mmdd = `${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const dateStr = `${year}-${mmdd}`;
            if (dailyDriverStatus[dateStr] && dailyDriverStatus[dateStr]._holidayName) {
                return dailyDriverStatus[dateStr]._holidayName;
            }
            return koreaHolidays[dateStr] || koreaHolidays[mmdd] || null;
        }

        let unsubscribeLogs = null; 
        let unsubscribeStatus = null;

        function loadFromFirebase(year, month) {
            if (unsubscribeLogs) unsubscribeLogs();
            
            const prevMonthDate = new Date(year, month - 1, 1);
            const startStr = `${prevMonthDate.getFullYear()}-${String(prevMonthDate.getMonth() + 1).padStart(2, '0')}-01`;
            const endStr = `${year}-${String(month + 1).padStart(2, '0')}-31`;

            unsubscribeLogs = db.collection('vehicle_logs')
                .where("date", ">=", startStr)
                .where("date", "<=", endStr)
                .onSnapshot(snapshot => {
                    allRecords = [];
                    snapshot.forEach(doc => {
                        let d = doc.data();
                        d.id = doc.id; 
                        allRecords.push(d);
                    });
                    
                    const loader = document.getElementById('loading-overlay');
                    if(loader) { loader.style.opacity = '0'; setTimeout(() => loader.style.display = 'none', 300); }

                    renderGlobalAlerts();
                    renderCalendar(); 
                    if(selectedDateStr) selectDate(selectedDateStr); 
                    if(document.getElementById('modal-overlay').style.display === 'flex') {
                        checkUnresolvedIssues();
                        updateRecentVehicleHint(document.getElementById('m-vehicle').value);
                    }

                    if (isFirstLoad) {
                        setTimeout(() => {
                            const cell = document.getElementById(`cell_${selectedDateStr}`);
                            if (cell) {
                                cell.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
                            }
                        }, 200);
                        isFirstLoad = false;
                    }
                }, error => {
                    console.error("DB 로드 에러:", error);
                });

            if (!unsubscribeStatus) {
                unsubscribeStatus = db.collection('daily_status').onSnapshot(snapshot => {
                    dailyDriverStatus = {};
                    snapshot.forEach(doc => { dailyDriverStatus[doc.id] = doc.data(); });
                    renderCalendar();
                });
            }
        }

        function renderGlobalAlerts() {
            const banner = document.getElementById('global-alert-banner');
            const listEl = document.getElementById('global-alert-list');
            if (!banner || !listEl) return;

            const unresolved = allRecords.filter(r => !r.isResolved && (
                r.type === '특이사항' || (r.type === '정기검사' && r.ipResult && r.ipResult.includes('불합격'))
            ));

            if (unresolved.length === 0) {
                banner.style.display = 'none';
                listEl.innerHTML = '';
                return;
            }

            banner.style.display = 'block';
            listEl.innerHTML = unresolved.map(issue => {
                const isInsp = issue.type === '정기검사';
                const badge = isInsp
                    ? `<span class="mini-badge breakdown">검사불합격</span>`
                    : `<span class="mini-badge issue">특이사항</span>`;
                const title = isInsp ? `${issue.ipType || '정기검사'} (${issue.ipReason || '사유미기재'})` : (issue.title || '');
                return `
                    <div class="alert-banner-item">
                        <div style="min-width:0; cursor:pointer;" onclick="selectDate('${issue.date}')">
                            <div style="font-weight:800; font-size:0.88rem; color:#333; display:flex; align-items:center; gap:5px;">
                                ${badge} <span>[${issue.vehicle}] ${title}</span>
                            </div>
                            <div style="font-size:0.76rem; color:#666; margin-top:3px;">
                                ${issue.detail || '재검/정비 요망'} (${issue.date} · ${issue.driver || ''})
                            </div>
                        </div>
                        <button type="button" onclick="resolveIssue('${issue.id}')" style="background:#28a745; color:#fff; border:none; padding:5px 10px; border-radius:6px; font-weight:800; font-size:0.78rem; cursor:pointer; flex-shrink:0;">해결완료</button>
                    </div>
                `;
            }).join('');
        }

        function changeMonth(offset) {
            currentDate.setMonth(currentDate.getMonth() + offset);
            const newYear = currentDate.getFullYear();
            const newMonth = currentDate.getMonth();
            
            selectedDateStr = `${newYear}-${String(newMonth + 1).padStart(2, '0')}-01`;
            isFirstLoad = true; 
            
            loadFromFirebase(newYear, newMonth);
        }

        function goToToday() {
            const now = new Date();
            currentDate = new Date(now.getFullYear(), now.getMonth(), 1);
            selectedDateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            isFirstLoad = true;
            loadFromFirebase(now.getFullYear(), now.getMonth());
        }

        window.onload = () => {
            initVehicleChips();
            document.getElementById('user-badge').innerText = `👤 작성자: ${currentUser}`;

            setTimeout(() => {
                const loader = document.getElementById('loading-overlay');
                if(loader && loader.style.display !== 'none') {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 300);
                }
            }, 1500);

            const _now = new Date();
            const year = _now.getFullYear(); 
            const month = _now.getMonth(); 
            const day = String(_now.getDate()).padStart(2, '0');
            selectedDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${day}`;
            
            isFirstLoad = true; 
            loadFromFirebase(year, month);
        };

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const shortYear = year.toString().slice(-2); 
            document.getElementById('current-month-display').innerText = `${shortYear}년 ${month + 1}월`;

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = `
                <div class="calendar-day-header sun">일</div><div class="calendar-day-header">월</div><div class="calendar-day-header">화</div>
                <div class="calendar-day-header">수</div><div class="calendar-day-header">목</div><div class="calendar-day-header">금</div><div class="calendar-day-header sat">토</div>
            `;

            for (let i = 0; i < firstDay; i++) grid.innerHTML += `<div class="calendar-cell" style="background:#f4f6f9; cursor:default;"></div>`;

            for (let i = 1; i <= lastDate; i++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const dayOfWeek = new Date(year, month, i).getDay();
                const holidayName = getHolidayName(year, month + 1, i);
                
                let extraClass = 'calendar-cell ';
                if(dayOfWeek === 0) extraClass += 'sun ';
                if(dayOfWeek === 6) extraClass += 'sat ';
                if(holidayName) extraClass += 'holiday ';
                if(dateStr === selectedDateStr) extraClass += 'selected ';

                let extraHTML = holidayName ? `<span class="holiday-name">${holidayName}</span>` : '';

                grid.innerHTML += `
                    <div class="${extraClass}" onclick="handleCellClick('${dateStr}')" id="cell_${dateStr}">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <span class="date-num">${i}</span>${extraHTML}
                        </div>
                        <div class="tag-container" id="tags_${dateStr}"></div>
                    </div>
                `;
            }
            updateAllTags();
        }

        function updateAllTags() {
            document.querySelectorAll('.tag-container').forEach(el => el.innerHTML = '');
            allRecords.forEach(r => {
                const container = document.getElementById(`tags_${r.date}`);
                if(!container) return;

                let tagHtml = '';
                if (r.type === '일정비') {
                    const defTxt = r.def ? `요소수${r.def}%` : '';
                    const chkTxt = `점검${r.chkCount || 0}/6`;
                    tagHtml = `<div class="event-box routine"><span class="mini-badge routine">일지</span><b>${r.vehicle}</b> <span>${defTxt} ${chkTxt}</span></div>`;
                } else if (r.type === '고장수리') {
                    tagHtml = `<div class="event-box breakdown"><span class="mini-badge breakdown">수리</span><b>${r.vehicle}</b> <span>${r.cause || '고장수리'}</span></div>`;
                } else if (r.type === '예방정비') {
                    tagHtml = `<div class="event-box preventive"><span class="mini-badge preventive">정비</span><b>${r.vehicle}</b> <span>${r.item || '예방정비'}</span></div>`;
                } else if (r.type === '정기검사') { 
                    if (r.ipResult === '불합격' || (r.ipResult && r.ipResult.includes('불합격'))) {
                        tagHtml = `<div class="event-box breakdown"><span class="mini-badge breakdown">불합격</span><b>${r.vehicle}</b> <span>${r.ipReason || '재검'}</span></div>`;
                    } else {
                        tagHtml = `<div class="event-box inspection"><span class="mini-badge inspection">검사</span><b>${r.vehicle}</b> <span>${r.ipType || '합격'}</span></div>`;
                    }
                } else if (r.type === '특이사항') {
                    tagHtml = `<div class="event-box issue"><span class="mini-badge issue">특이</span><b>${r.vehicle}</b> <span>${r.title || ''}</span></div>`;
                }
                container.innerHTML += tagHtml;
            });
        }

        function handleCellClick(dateStr) {
            selectDate(dateStr); 
        }

        function toggleInspectionReason() {
            const res = document.getElementById('ip-result').value;
            document.getElementById('ip-reason-group').style.display = res.includes('불합격') ? 'block' : 'none';
        }

        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            renderCalendar(); 

            document.getElementById('detail-title').innerText = `📋 기록 상세 (${dateStr})`;

            const contentUl = document.getElementById('detail-content');
            const dayRecords = allRecords.filter(r => r.date === dateStr);

            if(dayRecords.length === 0) {
                contentUl.innerHTML = `<li style="color:#666; text-align:center; padding: 25px; grid-column: 1 / -1;">이 날짜에 등록된 차량 기록이 없습니다.<br><span style="font-size:0.85rem; color:#888;">우측 상단의 <b>[+ 기록추가]</b> 버튼을 눌러 일지나 정비 내역을 등록하세요.</span></li>`;
                return;
            }

            let html = '';
            dayRecords.forEach(r => {
                let titleColor = r.type === '고장수리' ? '#dc3545' : (r.type === '예방정비' ? '#007bff' : (r.type === '특이사항' ? '#8e44ad' : (r.type === '정기검사' ? '#0ca678' : '#e65100')));
                if(r.type === '정기검사' && r.ipResult && r.ipResult.includes('불합격')) titleColor = '#dc3545';

                html += `<li>
                    <div>
                        <div style="font-weight: 800; color: ${titleColor}; margin-bottom: 8px; font-size: 1rem; border-bottom: 1px dashed #ccc; padding-bottom: 6px; display:flex; justify-content:space-between; align-items:center;">
                            <span>[${r.vehicle}] ${r.type}</span>
                            <span style="color:#666; font-size:0.82rem; font-weight:600;">작성: ${r.driver || '-'}</span>
                        </div>`;

                if (r.type === '일정비') {
                    html += `
                        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom: 6px; background:#fff; padding:6px 8px; border-radius:6px; border:1px solid #eee;">
                            <span><b>주행가능:</b> ${r.range ? r.range+'km' : '-'}</span>
                            <span><b>누적:</b> <b style="color:#0056b3;">${r.total ? r.total+'km' : '-'}</b></span>
                            <span><b>요소수:</b> <b style="color:#155724;">${r.def ? r.def+'%' : '-'}</b></span>
                        </div>
                        <div style="color: #495057; font-size: 0.85rem;">
                            <b>일일 점검:</b> 6항목 중 <b style="color:#fd7e14;">${r.chkCount}개</b> 양호 
                            <div style="color:#888; font-size:0.78rem; margin-top:2px;">(${r.chkItems || ''})</div>
                        </div>`;
                } else if (r.type === '고장수리') {
                    let shopText = r.shop ? ` | <b style="color:#007bff;">업체:</b> ${r.shop}` : '';
                    let totalKmText = r.total ? `<br><b>누적KM:</b> ${r.total}km` : '';
                    html += `<div><b>원인:</b> ${r.cause} | <b>부품:</b> ${r.part} ${totalKmText}<br><b>조치:</b> ${r.action}${shopText}</div>`;
                } else if (r.type === '예방정비') {
                    let shopText = r.shop ? ` | <b style="color:#007bff;">업체:</b> ${r.shop}` : '';
                    let totalKmText = r.total ? `<br><b>누적KM:</b> ${r.total}km` : '';
                    html += `<div><b>항목:</b> ${r.item} ${totalKmText}<br><b>조치:</b> ${r.action}${shopText}</div>`;
                } else if (r.type === '정기검사') { 
                    let shopText = r.shop ? ` | <b style="color:#0ca678;">업체:</b> ${r.shop}` : '';
                    let totalKmText = r.total ? `<br><b>누적KM:</b> ${r.total}km` : ''; 
                    let resultText = r.ipResult;
                    if (r.ipResult && r.ipResult.includes('불합격') && r.ipReason) resultText += `(${r.ipReason})`;
                    
                    let statusBadge = '';
                    if (r.ipResult && r.ipResult.includes('불합격')) {
                        statusBadge = r.isResolved 
                            ? `<span style="background:#28a745; color:white; padding:2px 6px; border-radius:4px; font-size:0.72rem; margin-left:5px;">재검합격(해결)</span>` 
                            : `<span style="background:#dc3545; color:white; padding:2px 6px; border-radius:4px; font-size:0.72rem; margin-left:5px;">재검요망</span>`;
                    }
                    let resColor = r.ipResult && r.ipResult.includes('불합격') ? '#dc3545' : '#28a745';
                    html += `<div><b>검사구분:</b> ${r.ipType} <span style="color:${resColor}; font-weight:bold;">[${resultText}]</span>${statusBadge}${totalKmText}<br><b>다음 검사일:</b> ${r.ipNextDate || '미정'}${shopText}</div>`;
                } else if (r.type === '특이사항') {
                    let statusBadge = r.isResolved 
                        ? `<span style="background:#28a745; color:white; padding:2px 6px; border-radius:4px; font-size:0.72rem; margin-left:5px;">해결완료</span>` 
                        : `<span style="background:#dc3545; color:white; padding:2px 6px; border-radius:4px; font-size:0.72rem; margin-left:5px;">미해결</span>`;
                    html += `<div><b style="color:#8e44ad;">증상:</b> ${r.title}${statusBadge}<br><b style="color:#555;">상세:</b> ${r.detail || '-'}</div>`;
                }
                
                html += `</div>
                    <div style="margin-top: 10px; text-align: right; border-top: 1px dashed #e1e4e8; padding-top: 8px;">
                        <button onclick="editRecord('${r.id}')" style="background:#ffc107; color:#000; border:none; padding:4px 12px; border-radius:5px; font-size:0.8rem; cursor:pointer; font-weight:800; margin-right:4px;">수정</button>
                        <button onclick="deleteRecord('${r.id}')" style="background:#dc3545; color:#fff; border:none; padding:4px 12px; border-radius:5px; font-size:0.8rem; cursor:pointer; font-weight:800;">삭제</button>
                    </div>
                </li>`;
            });
            contentUl.innerHTML = html;
        }

        function deleteRecord(docId) {
            if(confirm("정말 이 기록을 삭제하시겠습니까? (복구 불가능)")) {
                allRecords = allRecords.filter(r => r.id !== docId);
                renderGlobalAlerts();
                renderCalendar();
                selectDate(selectedDateStr);
                db.collection('vehicle_logs').doc(docId).delete().catch(e => alert("삭제 실패: " + e));
            }
        }

        function editRecord(docId) {
            const r = allRecords.find(x => x.id === docId);
            if(!r) return;

            document.getElementById('modal-date-title').innerText = `✏️ ${r.date} 기록 수정`;
            document.getElementById('modal-writer-label').innerText = `작성자: ${r.driver || currentUser}`;
            document.getElementById('m-date').value = r.date;
            document.getElementById('m-doc-id').value = r.id; 
            selectVehicleChip(r.vehicle || '1호차');
            
            document.getElementById('type-breakdown').checked = false;
            document.getElementById('type-preventive').checked = false;
            document.getElementById('type-inspection').checked = false;
            document.getElementById('type-issue').checked = false;
            document.getElementById('type-routine').checked = false;

            if (r.type === '고장수리') {
                document.getElementById('type-breakdown').checked = true;
                document.getElementById('bd-cause').value = r.cause || '';
                document.getElementById('bd-part').value = r.part || '';
                document.getElementById('bd-total').value = r.total ? r.total.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') : '';
                setShopFieldValue('bd', r.shop || '');
                document.getElementById('bd-action').value = r.action || '교체';
            } else if (r.type === '예방정비') {
                document.getElementById('type-preventive').checked = true;
                document.getElementById('pv-item').value = r.item || '';
                document.getElementById('pv-total').value = r.total ? r.total.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') : '';
                setShopFieldValue('pv', r.shop || '');
                document.getElementById('pv-action').value = r.action || '교체';
            } else if (r.type === '정기검사') {
                document.getElementById('type-inspection').checked = true;
                document.getElementById('ip-type').value = r.ipType || '정기검사';
                document.getElementById('ip-total').value = r.total ? r.total.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') : ''; 
                document.getElementById('ip-result').value = (r.ipResult && r.ipResult.includes('불합격')) ? '불합격' : '합격';
                document.getElementById('ip-reason').value = r.ipReason || ''; 
                document.getElementById('ip-next-date').value = r.ipNextDate || '';
                setShopFieldValue('ip', r.shop || '');
                toggleInspectionReason();
            } else if (r.type === '특이사항') {
                document.getElementById('type-issue').checked = true;
                document.getElementById('is-title').value = r.title || '';
                document.getElementById('is-detail').value = r.detail || '';
            } else {
                document.getElementById('type-routine').checked = true;
                document.getElementById('rt-range').value = r.range ? r.range.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') : '';
                document.getElementById('rt-total').value = r.total ? r.total.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') : '';
                document.getElementById('rt-def').value = r.def || '';
                document.querySelectorAll('.rt-chk').forEach(chk => { chk.checked = r.chkItems && r.chkItems.includes(chk.value); });
            }

            toggleFormType();
            checkUnresolvedIssues();
            
            document.getElementById('btn-save-submit').innerText = "📝 수정 저장";
            history.pushState({ isModal: true }, '', '');
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function checkUnresolvedIssues() {
            const vehicle = document.getElementById('m-vehicle').value;
            const warningBox = document.getElementById('issue-warning-container');
            
            const unresolved = allRecords.filter(r => r.vehicle === vehicle && !r.isResolved && 
                (r.type === '특이사항' || (r.type === '정기검사' && r.ipResult && r.ipResult.includes('불합격')))
            );

            if (unresolved.length > 0) {
                warningBox.style.display = 'flex';
                let html = '<span style="font-weight: 800; color: #d32f2f;">🚨 선택 차량 미해결 경고 (확인 및 해결 요망)</span>';
                
                unresolved.forEach(issue => {
                    let badge = issue.type === '정기검사' 
                        ? `<span style="background:#dc3545; color:white; padding:2px 4px; border-radius:4px; font-size:0.7rem; margin-right:4px;">검사불합격</span>` 
                        : `<span style="background:#8e44ad; color:white; padding:2px 4px; border-radius:4px; font-size:0.7rem; margin-right:4px;">특이사항</span>`;
                    
                    let titleText = issue.type === '정기검사' ? `${issue.ipType} 불합격(${issue.ipReason})` : issue.title;
                    let detailText = issue.type === '정기검사' ? `빠른 시일 내 정비 후 재검사 요망` : issue.detail;

                    html += `
                    <div class="issue-item">
                        <div style="display:flex; flex-direction:column; gap:3px;">
                            <span style="font-weight:bold; color:#721c24;">${badge} ${titleText}</span>
                            <span style="font-size:0.78rem; color:#666;">${detailText} (${issue.date}, ${issue.driver})</span>
                        </div>
                        <button type="button" onclick="resolveIssue('${issue.id}')" style="background: #28a745; color: white; border: none; padding: 6px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 0.8rem; flex-shrink:0;">해결</button>
                    </div>`;
                });
                warningBox.innerHTML = html;
            } else {
                warningBox.style.display = 'none';
                warningBox.innerHTML = '';
            }
        }

        function resolveIssue(docId) {
            const issue = allRecords.find(r => r.id === docId);
            if(!issue) return;

            const msg = issue.type === '정기검사' 
                ? '차량을 수리하고 재검사에서 최종 합격 처리되었습니까?' 
                : '이 특이사항(증상)이 정비되어 완전히 해결되었습니까?';
            
            if(!confirm(msg)) return;
            
            const idx = allRecords.findIndex(r => r.id === docId);
            if(idx !== -1) allRecords[idx].isResolved = true;
            renderGlobalAlerts();
            checkUnresolvedIssues(); 
            selectDate(selectedDateStr); 

            db.collection('vehicle_logs').doc(docId).update({ isResolved: true })
            .then(() => alert('해결 완료 처리되었습니다!'))
            .catch(e => alert('오류: ' + e));
        }

        function openModalForSelectedDate() {
            if(!selectedDateStr) {
                const _now = new Date();
                selectedDateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(_now.getDate()).padStart(2, '0')}`;
            }
            
            document.getElementById('modal-date-title').innerText = `📅 ${selectedDateStr} 기록 추가`;
            document.getElementById('modal-writer-label').innerText = `작성자: ${currentUser}`;
            document.getElementById('m-date').value = selectedDateStr;
            document.getElementById('m-doc-id').value = ""; 
            
            document.getElementById('bd-cause').value = ''; document.getElementById('bd-part').value = ''; document.getElementById('bd-total').value = ''; setShopFieldValue('bd', '');
            document.getElementById('pv-item').value = ''; document.getElementById('pv-total').value = ''; setShopFieldValue('pv', '');
            
            document.getElementById('ip-type').value = '정기검사'; 
            document.getElementById('ip-total').value = ''; 
            document.getElementById('ip-result').value = '합격'; 
            document.getElementById('ip-reason').value = ''; 
            document.getElementById('ip-next-date').value = ''; 
            setShopFieldValue('ip', '');
            toggleInspectionReason();

            document.getElementById('is-title').value = ''; document.getElementById('is-detail').value = ''; 
            document.getElementById('rt-range').value = ''; document.getElementById('rt-total').value = ''; document.getElementById('rt-def').value = '';
            document.querySelectorAll('.rt-chk').forEach(chk => chk.checked = false);

            document.getElementById('type-routine').checked = true;
            toggleFormType();
            selectVehicleChip(document.getElementById('m-vehicle').value || '1호차');
            
            document.getElementById('btn-save-submit').innerText = "💾 저장하기";
            history.pushState({ isModal: true }, '', '');
            document.getElementById('modal-overlay').style.display = 'flex'; 
        }

        // ✅ 원래의 기본 모달 닫기 및 뒤로가기 코드로 원복
        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
            if (history.state && history.state.isModal) history.back();
        }

        window.addEventListener('popstate', function() {
            const modal = document.getElementById('modal-overlay');
            if (modal && modal.style.display === 'flex') {
                modal.style.display = 'none';
            }
        });

        function toggleFormType() {
            const isBreakdown = document.getElementById('type-breakdown').checked;
            const isPreventive = document.getElementById('type-preventive').checked;
            const isInspection = document.getElementById('type-inspection').checked; 
            const isIssue = document.getElementById('type-issue').checked;
            
            document.getElementById('form-breakdown').style.display = isBreakdown ? 'block' : 'none';
            document.getElementById('form-preventive').style.display = isPreventive ? 'block' : 'none';
            document.getElementById('form-inspection').style.display = isInspection ? 'block' : 'none';
            document.getElementById('form-issue').style.display = isIssue ? 'block' : 'none';
            document.getElementById('form-routine').style.display = (!isBreakdown && !isPreventive && !isInspection && !isIssue) ? 'block' : 'none';
        }

        function saveMaintenance() {
            const date = document.getElementById('m-date').value;
            const vehicle = document.getElementById('m-vehicle').value;
            const driver = currentUser; 
            const docId = document.getElementById('m-doc-id').value; 
            
            const isBreakdown = document.getElementById('type-breakdown').checked;
            const isPreventive = document.getElementById('type-preventive').checked;
            const isInspection = document.getElementById('type-inspection').checked; 
            const isIssue = document.getElementById('type-issue').checked;
            
            let newRecord = { date: date, vehicle: vehicle, driver: driver };

            if(!docId) newRecord.timestamp = firebase.firestore.FieldValue.serverTimestamp();

            if (isBreakdown) {
                newRecord.type = '고장수리';
                newRecord.cause = document.getElementById('bd-cause').value.trim();
                newRecord.part = document.getElementById('bd-part').value.trim();
                newRecord.total = document.getElementById('bd-total').value.trim(); 
                newRecord.action = document.getElementById('bd-action').value;
                newRecord.shop = getShopFieldValue('bd'); 
                if(!newRecord.cause || !newRecord.part) return alert("고장 원인과 수리 부품을 모두 입력해주세요!");
            } 
            else if (isPreventive) {
                newRecord.type = '예방정비';
                newRecord.item = document.getElementById('pv-item').value.trim();
                newRecord.total = document.getElementById('pv-total').value.trim(); 
                newRecord.action = document.getElementById('pv-action').value;
                newRecord.shop = getShopFieldValue('pv'); 
                if(!newRecord.item) return alert("점검/정비 항목을 입력해주세요!");
            }
            else if (isInspection) { 
                newRecord.type = '정기검사';
                newRecord.ipType = document.getElementById('ip-type').value;
                newRecord.total = document.getElementById('ip-total').value.trim(); 
                newRecord.ipResult = document.getElementById('ip-result').value;
                
                if(newRecord.ipResult === '불합격') {
                    newRecord.ipReason = document.getElementById('ip-reason').value.trim();
                    if(!docId) newRecord.isResolved = false; 
                    if(!newRecord.ipReason) return alert("불합격 사유를 필수로 입력해주세요!");
                } else {
                    newRecord.ipReason = "";
                    if(!docId) newRecord.isResolved = true; 
                }

                newRecord.ipNextDate = document.getElementById('ip-next-date').value;
                newRecord.shop = getShopFieldValue('ip');
            }
            else if (isIssue) {
                newRecord.type = '특이사항';
                newRecord.title = document.getElementById('is-title').value.trim();
                newRecord.detail = document.getElementById('is-detail').value.trim();
                if(!docId) newRecord.isResolved = false;
                if(!newRecord.title) return alert("증상 요약을 입력해주세요!");
            }
            else { 
                newRecord.type = '일정비';
                newRecord.range = document.getElementById('rt-range').value.trim();
                newRecord.total = document.getElementById('rt-total').value.trim();
                newRecord.def = document.getElementById('rt-def').value.trim();
                
                if(!newRecord.total) return alert("누적KM를 반드시 입력해주세요!");
                
                let checkedItems = [];
                document.querySelectorAll('.rt-chk:checked').forEach(chk => checkedItems.push(chk.value));
                newRecord.chkCount = checkedItems.length;
                newRecord.chkItems = checkedItems.length > 0 ? checkedItems.join(', ') : "체크 안함";
            }
            
            const btnSave = document.getElementById('btn-save-submit');
            btnSave.innerText = "기록 중...";
            btnSave.disabled = true;

            const targetId = docId ? docId : Date.now().toString(); 
            newRecord.id = targetId;

            const existingIdx = allRecords.findIndex(r => r.id === targetId);
            if(existingIdx !== -1) allRecords[existingIdx] = newRecord;
            else allRecords.push(newRecord);

            renderGlobalAlerts();
            renderCalendar();
            selectDate(date);
            closeModal(); 
            
            db.collection('vehicle_logs').doc(targetId).set(newRecord, { merge: true }).then(() => {
                btnSave.innerText = "💾 저장하기";
                btnSave.disabled = false;
            }).catch(e => {
                alert("저장 실패! 다시 시도해주세요.");
                btnSave.innerText = "💾 저장하기";
                btnSave.disabled = false;
            });
        }
    </script>
</body>
</html>
