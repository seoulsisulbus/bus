<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=5.0, user-scalable=yes">
    <title>배차 및 운행 집계 (통합)</title>

    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; background-color: #f4f6f9; color: #333; letter-spacing: -0.3px; padding-bottom: 40px; }

        .top-bar { max-width: 1400px; margin: 15px auto 0; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .top-bar h2 { font-size: 1.3rem; color: #2c3e50; font-weight: 800; }
        .btn-back { background: #007bff; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 0.9rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-back:hover { background: #0056b3; }

        .container { max-width: 1400px; margin: 15px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }

        .month-selector { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 12px; border-bottom: 2px solid #007bff; }
        .month-title { font-size: 1.35rem; font-weight: 800; color: #007bff; cursor: pointer; }
        .month-btns { display: flex; gap: 6px; align-items: center; }
        .month-btns button { padding: 6px 14px; font-size: 1rem; font-weight: 700; cursor: pointer; border: 1px solid #ced4da; background: #fff; border-radius: 6px; font-family: inherit; }
        .month-btns button:hover { background: #f1f3f5; }

        .section-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 12px; color: #333; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .section-title span.sub { font-size: 0.8rem; color: #007bff; font-weight: 600; }

        .table-wrap { width: 100%; overflow-x: auto; }
        table.stats-table { width: 100%; border-collapse: collapse; min-width: 820px; font-size: 0.9rem; text-align: center; }
        table.stats-table th, table.stats-table td { border: 1px solid #dee2e6; padding: 10px 6px; }
        table.stats-table th { background: #eef2f7; font-weight: 800; color: #333; white-space: nowrap; }
        table.stats-table tbody tr:hover { background: #f8f9fa; }
        table.stats-table tbody tr.my-row { background: #f0f7ff; font-weight: 700; }
        table.stats-table tfoot th, table.stats-table tfoot td { background: #e8f0fe; font-weight: 800; color: #0056b3; }

        .driver-name-cell { cursor: pointer; color: #0056b3; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
        .num-zero { color: #ccc; }
        .num-active { font-weight: 700; color: #333; }
        .num-total { font-weight: 900; color: #007bff; background: #f8fbff; }
        .num-cancel { color: #adb5bd; font-weight: 600; }
        .num-duty { color: #f29900; font-weight: 800; }
        .num-off { color: #d9534f; font-weight: 700; }
        .num-settle { color: #155724; font-weight: 800; background: #f0fdf4; }

        #driver-detail-box { display: none; margin-top: 15px; background: #f8f9fa; border: 2px solid #007bff; border-radius: 8px; padding: 15px; }
        #driver-detail-box h4 { color: #007bff; margin-bottom: 10px; font-size: 1.05rem; display: flex; justify-content: space-between; align-items: center; }
        .detail-list { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
        .detail-list li { background: #fff; border: 1px solid #dee2e6; padding: 10px; border-radius: 6px; font-size: 0.88rem; line-height: 1.5; }

        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); z-index: 9999; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; font-weight: 700; color: #007bff; }

        @media (max-width: 768px) {
            .top-bar { padding: 10px 12px; }
            .container { padding: 0 10px; gap: 12px; }
            .card { padding: 14px; }
            table.stats-table { font-size: 0.82rem; }
            table.stats-table th, table.stats-table td { padding: 8px 4px; }
        }
    </style>
</head>
<body>
    <div id="loading-overlay"><div id="loading-text">집계 데이터 계산 중...</div></div>

    <div class="top-bar">
        <h2>📊 월간 배차 및 정산 집계</h2>
        <div style="display: flex; gap: 6px;">
            <button id="btn-toggle-view" onclick="toggleViewMode()" style="background: #17a2b8; color: white; border: none; padding: 8px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.85rem;">PC버전</button>
            <button class="btn-back" onclick="location.href='index.html'">📅 배차판 돌아가기</button>
        </div>
    </div>

    <div class="container">
        <!-- 운전원별 집계 카드 -->
        <div class="card">
            <div class="month-selector">
                <span class="month-title" id="month-display" onclick="goToThisMonth()" title="클릭하면 이번 달로 이동합니다">2026년 10월 집계</span>
                <div class="month-btns">
                    <button onclick="changeMonth(-1)">＜ 이전 달</button>
                    <button onclick="goToThisMonth()" style="background:#e8f0fe; color:#0056b3; border-color:#b6d4fe;">이번 달</button>
                    <button onclick="changeMonth(1)">다음 달 ＞</button>
                </div>
            </div>

            <div class="section-title">
                <span>👤 운전원별 월간 배차 및 정산 현황</span>
                <span class="sub">💡 운전원 이름을 누르면 아래에 상세 운행 내역이 표시됩니다. (단위: 일수基準)</span>
            </div>

            <div class="table-wrap">
                <table class="stats-table">
                    <thead>
                        <tr>
                            <th>운전원</th>
                            <th>공공</th>
                            <th>1박(일)</th>
                            <th>2박(일)</th>
                            <th>성묘</th>
                            <th>시티</th>
                            <th>서울/기타</th>
                            <th>실운행 합계</th>
                            <th>4일전취소</th>
                            <th>당직</th>
                            <th>휴무</th>
                            <th>보상시간(T)</th>
                            <th>일비 합계(원)</th>
                        </tr>
                    </thead>
                    <tbody id="driver-stats-tbody"></tbody>
                    <tfoot id="driver-stats-tfoot"></tfoot>
                </table>
            </div>

            <!-- 운전원 클릭 시 상세 내역 표시 영역 -->
            <div id="driver-detail-box">
                <h4>
                    <span id="driver-detail-title">상세 운행 내역</span>
                    <button onclick="document.getElementById('driver-detail-box').style.display='none'" style="background:#6c757d; color:#fff; border:none; padding:4px 10px; border-radius:4px; cursor:pointer; font-size:0.8rem;">닫기</button>
                </h4>
                <ul class="detail-list" id="driver-detail-list"></ul>
            </div>
        </div>

        <!-- 차량별 집계 카드 -->
        <div class="card">
            <div class="section-title">
                <span>🚌 차량별 월간 운행 및 거리(km) 집계</span>
            </div>
            <div class="table-wrap">
                <table class="stats-table" style="min-width: 600px;">
                    <thead>
                        <tr>
                            <th>차량명</th>
                            <th>구분</th>
                            <th>공공/서울</th>
                            <th>1박/2박(일)</th>
                            <th>성묘</th>
                            <th>시티/기타</th>
                            <th>실운행(일)</th>
                            <th>4일전취소</th>
                            <th>누적 거리(km)</th>
                        </tr>
                    </thead>
                    <tbody id="vehicle-stats-tbody"></tbody>
                    <tfoot id="vehicle-stats-tfoot"></tfoot>
                </table>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCipeqfmU03bZQozFt8MdToxxuDyFIUd-g",
            authDomain: "park-fc66f.firebaseapp.com",
            projectId: "park-fc66f",
            storageBucket: "park-fc66f.firebasestorage.app",
            messagingSenderId: "93011031366",
            appId: "1:93011031366:web:72438cb8d71dd5a7902147"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const koreaHolidays = {
            "01-01": "신정", "03-01": "삼일절", "05-05": "어린이날", "06-06": "현충일", 
            "08-15": "광복절", "10-03": "개천절", "10-09": "한글날", "12-25": "기독탄신일",
            "2026-02-16": "설날연휴", "2026-02-17": "설날", "2026-02-18": "설날연휴",
            "2026-03-02": "대체공휴일", "2026-05-24": "부처님오신날", "2026-05-25": "대체공휴일",
            "2026-06-03": "지방선거", "2026-08-17": "대체공휴일", "2026-09-24": "추석연휴", 
            "2026-09-25": "추석", "2026-09-26": "추석연휴", "2026-10-05": "대체공휴일",
            "2027-02-06": "설날연휴", "2027-02-07": "설날", "2027-02-08": "설날연휴", "2027-02-09": "대체공휴일",
            "2027-05-01": "노동절", "2027-05-03": "대체공휴일", "2027-05-13": "부처님오신날",
            "2027-07-17": "제헌절", "2027-07-19": "대체공휴일", "2027-08-15": "광복절",
            "2027-08-16": "대체공휴일", "2027-09-14": "추석연휴", "2027-09-15": "추석", "2027-09-16": "추석연휴",
            "2027-10-04": "대체공휴일", "2027-10-11": "대체공휴일", "2027-12-27": "대체공휴일"
        };

        const defaultDrivers = ['박기준', '변석현', '이명순', '김탁', '한상훈', '문인식', '황덕일', '강철규', '이상헌', '함동한', '정한중', '조병준'];
        const allVehicles = ['1호차', '2호차', '3호차', '예비버스', '11호차', '12호차', '13호차', '14호차', '3818'];

        let driverListModifiers = {};
        let engineModifiers = {};
        let dailyDriverStatus = {};
        let autoDutyByDate = {};
        let allReservations = [];

        const _now = new Date();
        let currentYear = _now.getFullYear();
        let currentMonth = _now.getMonth();
        let currentUser = localStorage.getItem('loggedInUser') || '';

        let loadedStartStr = '';
        let loadedEndStr = '';
        let unsubRes = null;
        let unsubStatus = null;
        let unsubMod = null;

        function getHolidayName(year, month, day) {
            const mmdd = `${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const dateStr = `${year}-${mmdd}`;
            if (dailyDriverStatus[dateStr] && dailyDriverStatus[dateStr]._holidayName) {
                return dailyDriverStatus[dateStr]._holidayName;
            }
            return koreaHolidays[dateStr] || koreaHolidays[mmdd] || null;
        }

        function getEffectiveDriverList(date) {
            const modDates = Object.keys(driverListModifiers).sort();
            let effectiveList = [...defaultDrivers];
            for (const modDate of modDates) {
                if (modDate <= date) effectiveList = [...driverListModifiers[modDate]];
            }
            return effectiveList;
        }

        function getEffectiveEngine(date) {
            const modDates = Object.keys(engineModifiers).sort();
            let isB = false;
            for (const modDate of modDates) {
                if (modDate <= date) isB = engineModifiers[modDate];
            }
            return isB;
        }

        function getDriverStatus(date, driver) {
            if (!dailyDriverStatus[date]) return '출근';
            return dailyDriverStatus[date][driver] || '출근';
        }

        // 🚀 메인창(index.html)과 100% 동일한 당번(당직) 자동 순환 엔진
        function calculateAutoDuty() {
            autoDutyByDate = {};
            if (!loadedStartStr || !loadedEndStr) return;

            const anchorDateStr = '2026-10-22';
            const anchorDriver = '문인식';

            const todayObj = new Date();
            const maxDutyObj = new Date(todayObj.getFullYear(), todayObj.getMonth(), todayObj.getDate() + 14);
            const maxDutyStr = `${maxDutyObj.getFullYear()}-${String(maxDutyObj.getMonth() + 1).padStart(2, '0')}-${String(maxDutyObj.getDate()).padStart(2, '0')}`;

            Object.keys(dailyDriverStatus).forEach(dateStr => {
                if (dateStr < anchorDateStr) {
                    const statusData = dailyDriverStatus[dateStr] || {};
                    const manualDuty = Object.keys(statusData).filter(k => !k.startsWith('_') && statusData[k] === '당직');
                    if (manualDuty.length > 0) autoDutyByDate[dateStr] = manualDuty;
                }
            });

            let cur = new Date(2026, 9, 22);
            const end = new Date(loadedEndStr > maxDutyStr ? loadedEndStr : maxDutyStr);
            let lastDutyDriver = null;

            while (cur <= end) {
                const y = cur.getFullYear();
                const m = cur.getMonth() + 1;
                const d = cur.getDate();
                const dateStr = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const dayOfWeek = cur.getDay();
                const isHoliday = getHolidayName(y, m, d) !== null;
                const statusData = dailyDriverStatus[dateStr] || {};

                if (dayOfWeek === 0 || dayOfWeek === 6 || isHoliday) {
                    autoDutyByDate[dateStr] = [];
                    cur.setDate(cur.getDate() + 1);
                    continue;
                }

                if (dateStr > maxDutyStr) {
                    const manualFuture = statusData._manualDuty ? [statusData._manualDuty] : [];
                    autoDutyByDate[dateStr] = manualFuture;
                    cur.setDate(cur.getDate() + 1);
                    continue;
                }

                const dayRes = allReservations.filter(r => (r.dates || []).includes(dateStr));
                const workingDrivers = new Set();
                dayRes.forEach(r => {
                    if (!r.isCanceled) {
                        (r.assigned || []).forEach(drv => workingDrivers.add(drv));
                    }
                });

                let manualDuty = [];
                if (dateStr <= '2026-10-28') {
                    manualDuty = Object.keys(statusData).filter(drv =>
                        !drv.startsWith('_') &&
                        statusData[drv] === '당직' &&
                        drv !== '함동한' &&
                        getDriverStatus(dateStr, drv) !== '휴무' &&
                        !workingDrivers.has(drv)
                    );
                } else if (statusData._manualDuty) {
                    const mDrv = statusData._manualDuty;
                    if (mDrv !== '함동한' && getDriverStatus(dateStr, mDrv) !== '휴무' && !workingDrivers.has(mDrv)) {
                        manualDuty = [mDrv];
                    }
                }

                if (manualDuty.length > 0) {
                    autoDutyByDate[dateStr] = manualDuty;
                    lastDutyDriver = manualDuty[manualDuty.length - 1];
                } else if (dateStr === anchorDateStr) {
                    if (!workingDrivers.has(anchorDriver) && getDriverStatus(dateStr, anchorDriver) !== '휴무') {
                        autoDutyByDate[dateStr] = [anchorDriver];
                        lastDutyDriver = anchorDriver;
                    } else {
                        autoDutyByDate[dateStr] = [];
                        lastDutyDriver = anchorDriver;
                    }
                } else {
                    const currentList = getEffectiveDriverList(dateStr);
                    let startIndex = 0;
                    if (lastDutyDriver && currentList.includes(lastDutyDriver)) {
                        startIndex = (currentList.indexOf(lastDutyDriver) + 1) % currentList.length;
                    }

                    let picked = null;
                    for (let i = 0; i < currentList.length; i++) {
                        const candidate = currentList[(startIndex + i) % currentList.length];
                        if (candidate === '함동한') continue;
                        if (getDriverStatus(dateStr, candidate) === '휴무') continue;
                        if (workingDrivers.has(candidate)) continue;

                        picked = candidate;
                        break;
                    }

                    if (picked) {
                        autoDutyByDate[dateStr] = [picked];
                        lastDutyDriver = picked;
                    } else {
                        autoDutyByDate[dateStr] = [];
                    }
                }

                cur.setDate(cur.getDate() + 1);
            }
        }

        // 🚀 메인창(index.html)과 100% 동일한 배차 계산 엔진 (4일전 취소자 휴무 시 배차 고정 반영)
        function recalculateAll() {
            allReservations.forEach(r => {
                if (r.isCanceled && (!r.canceledDrivers || r.canceledDrivers.length === 0) && r.assigned && r.assigned.length > 0) {
                    r.canceledDrivers = [...r.assigned];
                }
                r.assigned = [];
            });

            allReservations.sort((a, b) => {
                if (a.startDate !== b.startDate) return new Date(a.startDate) - new Date(b.startDate);

                const engineB = getEffectiveEngine(a.startDate);

                if (engineB) {
                    const getBTypeWeight = (t) => {
                        if (t.includes('공공') || t.includes('1박') || t.includes('2박') || t.includes('서울')) return 1;
                        if (t.includes('성묘')) return 2;
                        if (t.includes('시티')) return 3;
                        return 4;
                    };
                    const wA = getBTypeWeight(a.type);
                    const wB = getBTypeWeight(b.type);
                    if (wA !== wB) return wA - wB;

                    const getBVehWeight = (v) => {
                        if (v === '1호차') return 1; if (v === '2호차') return 2; if (v === '3호차') return 3; if (v === '예비버스') return 4;
                        if (v === '11호차') return 5; if (v === '12호차') return 6; if (v === '13호차') return 7; if (v === '14호차') return 8; if (v === '3818') return 9; return 99;
                    };
                    const vA = getBVehWeight(a.vehicle);
                    const vB = getBVehWeight(b.vehicle);
                    if (vA !== vB) return vA - vB;

                    if (a.km !== b.km) return a.km - b.km;
                    return 0;
                } else {
                    const isBusA = ['1호차', '2호차', '3호차', '예비버스'].includes(a.vehicle);
                    const isBusB = ['1호차', '2호차', '3호차', '예비버스'].includes(b.vehicle);
                    if (isBusA !== isBusB) return isBusA ? -1 : 1;

                    const getTypeWeight = (t, isBus) => {
                        if (isBus) {
                            if (t.includes('공공') || t.includes('서울')) return 1;
                            if (t.includes('1박')) return 2; if (t.includes('2박')) return 3;
                            if (t.includes('성묘')) return 4; if (t.includes('나들이')) return 5;
                            if (t.includes('시티')) return 6; return 99;
                        } else {
                            if (t.includes('공공') || t.includes('서울') || t.includes('성묘')) return 1;
                            if (t.includes('1박')) return 2; if (t.includes('2박')) return 3;
                            if (t.includes('나들이')) return 4; if (t.includes('시티')) return 5; return 99;
                        }
                    };
                    const wA = getTypeWeight(a.type, isBusA);
                    const wB = getTypeWeight(b.type, isBusB);
                    if (wA !== wB) return wA - wB;

                    if (a.km !== b.km) return a.km - b.km;

                    const vehWeight = (v) => {
                        if (v === '3호차') return 1; if (v === '1호차') return 2; if (v === '2호차') return 3; if (v === '예비버스') return 4;
                        if (v === '11호차') return 5; if (v === '12호차') return 6; if (v === '13호차') return 7; if (v === '14호차') return 8; if (v === '3818') return 9; return 99;
                    };
                    return vehWeight(a.vehicle) - vehWeight(b.vehicle);
                }
            });

            let pointer = 0; let lastProcessedDate = null; let currentList = [...defaultDrivers];

            allReservations.forEach(res => {
                if (res.startDate !== lastProcessedDate) {
                    lastProcessedDate = res.startDate;
                    currentList = getEffectiveDriverList(res.startDate);
                    if (currentList.length > 0) pointer = pointer % currentList.length;
                }

                if (res.isManual && res.manualDrivers && res.manualDrivers.length > 0) {
                    res.assigned = [...res.manualDrivers];
                } else {
                    let loopGuard = 0;
                    while (res.assigned.length < res.reqCount && loopGuard < 50 && currentList.length > 0) {
                        const candidate = currentList[pointer];
                        let isWorkingAllDays = true;

                        for (let d of res.dates) {
                            if (getDriverStatus(d, candidate) === '휴무') {
                                // 🚀 4일전 취소된 배차의 운전원이 취소로 인해 휴무를 쓴 경우 건너뛰지 않고 유지!
                                if (res.isCanceled && res.canceledDrivers && res.canceledDrivers.includes(candidate)) {
                                    continue;
                                }
                                isWorkingAllDays = false;
                                break;
                            }
                        }

                        let isOverlapping = false;
                        for (let other of allReservations) {
                            if (other.id !== res.id && other.assigned.includes(candidate)) {
                                if (res.dates.some(d => other.dates.includes(d))) { isOverlapping = true; break; }
                            }
                        }

                        if (isWorkingAllDays && !isOverlapping) res.assigned.push(candidate);
                        pointer = (pointer + 1) % currentList.length;
                        loopGuard++;
                    }
                }

                if (res.nextPointerDriver && currentList.includes(res.nextPointerDriver)) {
                    pointer = currentList.indexOf(res.nextPointerDriver);
                }
            });

            calculateAutoDuty();
            renderStats();
        }

        function loadFromFirebase() {
            document.getElementById('loading-overlay').style.display = 'flex';

            if (!loadedStartStr || !loadedEndStr) {
                const startDate = new Date(currentYear, currentMonth - 1, 1);
                const endDate = new Date(currentYear, currentMonth + 2, 0);
                loadedStartStr = `${startDate.getFullYear()}-${String(startDate.getMonth() + 1).padStart(2, '0')}-01`;
                loadedEndStr = `${endDate.getFullYear()}-${String(endDate.getMonth() + 1).padStart(2, '0')}-${String(endDate.getDate()).padStart(2, '0')}`;
            }

            if (unsubRes) unsubRes();

            unsubRes = db.collection('reservations')
                         .where("startDate", ">=", loadedStartStr)
                         .where("startDate", "<=", loadedEndStr)
                         .onSnapshot(snapshot => {
                allReservations = [];
                snapshot.forEach(doc => {
                    const d = doc.data(); d.id = doc.id;
                    allReservations.push(d);
                });
                recalculateAll();
                document.getElementById('loading-overlay').style.display = 'none';
            }, err => {
                console.error(err);
                document.getElementById('loading-overlay').style.display = 'none';
            });

            if (!unsubStatus) {
                unsubStatus = db.collection('daily_status').onSnapshot(snapshot => {
                    dailyDriverStatus = {};
                    snapshot.forEach(doc => { dailyDriverStatus[doc.id] = doc.data(); });
                    recalculateAll();
                });
            }

            if (!unsubMod) {
                unsubMod = db.collection('driver_modifiers').onSnapshot(snapshot => {
                    driverListModifiers = {};
                    engineModifiers = {};
                    snapshot.forEach(doc => {
                        driverListModifiers[doc.id] = doc.data().list;
                        engineModifiers[doc.id] = doc.data().useEngineB || false;
                    });
                    recalculateAll();
                });
            }
        }

        function changeMonth(offset) {
            currentMonth += offset;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            else if (currentMonth > 11) { currentMonth = 0; currentYear++; }

            document.getElementById('driver-detail-box').style.display = 'none';

            const viewStart = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-01`;
            const lastDay = new Date(currentYear, currentMonth + 1, 0).getDate();
            const viewEnd = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;

            if (viewStart < loadedStartStr) {
                loadedStartStr = viewStart;
                loadFromFirebase();
            } else if (viewEnd > loadedEndStr) {
                loadedEndStr = viewEnd;
                loadFromFirebase();
            } else {
                renderStats();
            }
        }

        function goToThisMonth() {
            const now = new Date();
            currentYear = now.getFullYear();
            currentMonth = now.getMonth();
            document.getElementById('driver-detail-box').style.display = 'none';
            renderStats();
        }

        function formatCell(val, activeClass = 'num-active') {
            return val === 0 ? `<span class="num-zero">0</span>` : `<span class="${activeClass}">${val}</span>`;
        }

        function renderStats() {
            const ymPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
            document.getElementById('month-display').innerText = `${currentYear}년 ${currentMonth + 1}월 집계`;

            const lastDay = new Date(currentYear, currentMonth + 1, 0).getDate();
            const monthDrivers = getEffectiveDriverList(`${ymPrefix}-${String(lastDay).padStart(2, '0')}`);
            // 명단에 없더라도 기본 명단에 있는 운전원 포함
            defaultDrivers.forEach(d => { if (!monthDrivers.includes(d)) monthDrivers.push(d); });

            const driverStats = {};
            monthDrivers.forEach(d => {
                driverStats[d] = {
                    pub: 0, night1: 0, night2: 0, grave: 0, city: 0, etc: 0,
                    totalActive: 0, canceled: 0, duty: 0, off: 0,
                    overtime: 0, allowance: 0, details: []
                };
            });

            // 1. 해당 월의 날짜별 당직 및 휴무 집계
            for (let day = 1; day <= lastDay; day++) {
                const dateStr = `${ymPrefix}-${String(day).padStart(2, '0')}`;
                const dutyList = autoDutyByDate[dateStr] || [];
                dutyList.forEach(drv => {
                    if (driverStats[drv]) driverStats[drv].duty++;
                });

                const statusData = dailyDriverStatus[dateStr] || {};
                Object.keys(statusData).forEach(drv => {
                    if (!drv.startsWith('_') && statusData[drv] === '휴무' && driverStats[drv]) {
                        driverStats[drv].off++;
                    }
                });
            }

            // 2. 차량별 집계 초기화
            const vehStats = {};
            allVehicles.forEach(v => {
                vehStats[v] = { pubSeoul: 0, night: 0, grave: 0, cityEtc: 0, totalActive: 0, canceled: 0, km: 0 };
            });

            // 3. 예약 내역 순회하며 운전원별 & 차량별 집계
            allReservations.forEach(r => {
                const monthDates = (r.dates || []).filter(d => d.startsWith(ymPrefix));
                if (monthDates.length === 0) return;

                const daysInMonth = monthDates.length;
                const t = r.type || '';
                const v = r.vehicle;

                // 차량별 집계
                if (vehStats[v]) {
                    if (r.isCanceled) {
                        vehStats[v].canceled += daysInMonth;
                    } else {
                        vehStats[v].totalActive += daysInMonth;
                        if (r.startDate.startsWith(ymPrefix)) {
                            vehStats[v].km += (parseInt(r.km) || 0);
                        }
                        if (t.includes('공공') || t.includes('서울')) vehStats[v].pubSeoul += daysInMonth;
                        else if (t.includes('1박') || t.includes('2박')) vehStats[v].night += daysInMonth;
                        else if (t.includes('성묘')) vehStats[v].grave += daysInMonth;
                        else vehStats[v].cityEtc += daysInMonth;
                    }
                }

                // 운전원별 배차 및 정산 집계
                (r.assigned || []).forEach(drv => {
                    if (!driverStats[drv]) return;
                    const st = driverStats[drv];

                    if (r.isCanceled) {
                        st.canceled += daysInMonth;
                        st.details.push({
                            date: monthDates.join('~'),
                            text: `[취소됨] ${r.vehicle} (${r.type}) - ${r.start || '미입력'} ➔ ${r.end || '미입력'}`,
                            isCanceled: true
                        });
                    } else {
                        st.totalActive += daysInMonth;
                        if (t.includes('공공')) st.pub += daysInMonth;
                        else if (t.includes('1박')) st.night1 += daysInMonth;
                        else if (t.includes('2박')) st.night2 += daysInMonth;
                        else if (t.includes('성묘')) st.grave += daysInMonth;
                        else if (t.includes('시티')) st.city += daysInMonth;
                        else st.etc += daysInMonth;

                        monthDates.forEach(dStr => {
                            const settle = (r.settlement && r.settlement[drv] && r.settlement[drv][dStr]) ? r.settlement[drv][dStr] : null;
                            if (settle) {
                                st.overtime += (parseFloat(settle.overtime) || 0);
                                st.allowance += (parseInt(settle.allowance) || 0);
                            }
                        });

                        st.details.push({
                            date: monthDates.join('~'),
                            text: `[${r.vehicle}] ${r.type} | ${r.start || '미입력'} ➔ ${r.end || '미입력'} ${r.dest ? `(${r.dest})` : ''}`,
                            isCanceled: false
                        });
                    }
                });
            });

            // 운전원 표 렌더링
            const dTbody = document.getElementById('driver-stats-tbody');
            const dTfoot = document.getElementById('driver-stats-tfoot');
            let dHtml = '';
            let sum = { pub: 0, night1: 0, night2: 0, grave: 0, city: 0, etc: 0, totalActive: 0, canceled: 0, duty: 0, off: 0, overtime: 0, allowance: 0 };

            monthDrivers.forEach(drv => {
                const s = driverStats[drv];
                sum.pub += s.pub; sum.night1 += s.night1; sum.night2 += s.night2;
                sum.grave += s.grave; sum.city += s.city; sum.etc += s.etc;
                sum.totalActive += s.totalActive; sum.canceled += s.canceled;
                sum.duty += s.duty; sum.off += s.off;
                sum.overtime += s.overtime; sum.allowance += s.allowance;

                const isMe = (drv === currentUser) ? 'my-row' : '';

                dHtml += `
                    <tr class="${isMe}">
                        <td class="driver-name-cell" onclick="showDriverDetails('${drv}')">${drv}</td>
                        <td>${formatCell(s.pub)}</td>
                        <td>${formatCell(s.night1)}</td>
                        <td>${formatCell(s.night2)}</td>
                        <td>${formatCell(s.grave)}</td>
                        <td>${formatCell(s.city)}</td>
                        <td>${formatCell(s.etc)}</td>
                        <td class="num-total">${s.totalActive}</td>
                        <td>${formatCell(s.canceled, 'num-cancel')}</td>
                        <td>${formatCell(s.duty, 'num-duty')}</td>
                        <td>${formatCell(s.off, 'num-off')}</td>
                        <td class="num-settle">${s.overtime > 0 ? s.overtime.toFixed(2) : '<span class="num-zero">0.00</span>'}</td>
                        <td class="num-settle">${s.allowance > 0 ? s.allowance.toLocaleString() : '<span class="num-zero">0</span>'}</td>
                    </tr>`;
            });
            dTbody.innerHTML = dHtml;

            dTfoot.innerHTML = `
                <tr>
                    <th>총 합계</th>
                    <td>${sum.pub}</td>
                    <td>${sum.night1}</td>
                    <td>${sum.night2}</td>
                    <td>${sum.grave}</td>
                    <td>${sum.city}</td>
                    <td>${sum.etc}</td>
                    <td>${sum.totalActive}</td>
                    <td>${sum.canceled}</td>
                    <td>${sum.duty}</td>
                    <td>${sum.off}</td>
                    <td>${sum.overtime.toFixed(2)} T</td>
                    <td>${sum.allowance.toLocaleString()} 원</td>
                </tr>`;

            window._currentDriverStats = driverStats;

            // 차량 표 렌더링
            const vTbody = document.getElementById('vehicle-stats-tbody');
            const vTfoot = document.getElementById('vehicle-stats-tfoot');
            let vHtml = '';
            let vSum = { pubSeoul: 0, night: 0, grave: 0, cityEtc: 0, totalActive: 0, canceled: 0, km: 0 };

            allVehicles.forEach(v => {
                const vs = vehStats[v];
                vSum.pubSeoul += vs.pubSeoul; vSum.night += vs.night; vSum.grave += vs.grave;
                vSum.cityEtc += vs.cityEtc; vSum.totalActive += vs.totalActive;
                vSum.canceled += vs.canceled; vSum.km += vs.km;

                const isBus = ['1호차', '2호차', '3호차', '예비버스'].includes(v);
                const vType = v === '3818' ? '스타리아' : (isBus ? '대형버스' : '쏠라티');

                vHtml += `
                    <tr>
                        <td style="font-weight:800;">${v}</td>
                        <td style="color:#666; font-size:0.85rem;">${vType}</td>
                        <td>${formatCell(vs.pubSeoul)}</td>
                        <td>${formatCell(vs.night)}</td>
                        <td>${formatCell(vs.grave)}</td>
                        <td>${formatCell(vs.cityEtc)}</td>
                        <td class="num-total">${vs.totalActive}</td>
                        <td>${formatCell(vs.canceled, 'num-cancel')}</td>
                        <td style="font-weight:700; color:#0056b3;">${vs.km.toLocaleString()} km</td>
                    </tr>`;
            });
            vTbody.innerHTML = vHtml;

            vTfoot.innerHTML = `
                <tr>
                    <th colspan="2">차량 총합계</th>
                    <td>${vSum.pubSeoul}</td>
                    <td>${vSum.night}</td>
                    <td>${vSum.grave}</td>
                    <td>${vSum.cityEtc}</td>
                    <td>${vSum.totalActive}</td>
                    <td>${vSum.canceled}</td>
                    <td>${vSum.km.toLocaleString()} km</td>
                </tr>`;
        }

        function showDriverDetails(drv) {
            const st = window._currentDriverStats && window._currentDriverStats[drv];
            if (!st) return;

            const box = document.getElementById('driver-detail-box');
            const title = document.getElementById('driver-detail-title');
            const ul = document.getElementById('driver-detail-list');

            title.innerText = `📋 [${drv}] ${currentMonth + 1}월 상세 배차 내역 (실운행 ${st.totalActive}일 / 취소 ${st.canceled}일)`;
            if (st.details.length === 0) {
                ul.innerHTML = `<li style="color:#888;">이번 달 배차 내역이 없습니다.</li>`;
            } else {
                st.details.sort((a, b) => a.date.localeCompare(b.date));
                ul.innerHTML = st.details.map(item => `
                    <li style="${item.isCanceled ? 'color:#adb5bd; text-decoration:line-through;' : ''}">
                        <b style="color:#007bff;">[${item.date}]</b><br>${item.text}
                    </li>
                `).join('');
            }
            box.style.display = 'block';
            box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        let isMobileView = true;
        function toggleViewMode() {
            const viewport = document.querySelector('meta[name="viewport"]');
            const btn = document.getElementById('btn-toggle-view');
            if (isMobileView) {
                viewport.setAttribute('content', 'width=1100, user-scalable=yes');
                btn.innerText = '📱폰화면';
                btn.style.background = '#ffc107';
                btn.style.color = '#000';
                isMobileView = false;
            } else {
                viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=5.0, user-scalable=yes');
                btn.innerText = 'PC버전';
                btn.style.background = '#17a2b8';
                btn.style.color = '#fff';
                isMobileView = true;
            }
        }

        window.onload = () => {
            const savedDate = sessionStorage.getItem('lastSelectedDate');
            if (savedDate) {
                const parts = savedDate.split('-');
                currentYear = parseInt(parts[0]);
                currentMonth = parseInt(parts[1]) - 1;
            }
            loadFromFirebase();
        };
    </script>
</body>
</html>
